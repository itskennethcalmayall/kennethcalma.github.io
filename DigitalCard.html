<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merry Christmas!</title>
    <style>
        body {
            background-color: #0b1d3a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Falling Snowflakes */
        .snowflake {
            position: absolute;
            top: -10px;
            background: #ffffff;
            border-radius: 50%;
            opacity: 0.8;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10px) translateX(0); }
            100% { transform: translateY(105vh) translateX(20px); }
        }

        /* Digital Card Container */
        .card {
            background: rgba(15, 32, 67, 0.85);
            border: 2px solid #ffd700;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 215, 0, 0.3);
            width: 340px;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 5;
            backdrop-filter: blur(5px);
        }

        /* Greeting Header */
        .greeting-header {
            text-align: center;
            color: #fff;
            margin-bottom: 10px;
        }

        .greeting-header h1 {
            font-size: 24px;
            margin: 0 0 5px 0;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .greeting-header p {
            font-size: 13px;
            color: #dcdde1;
            margin: 0;
        }

        .scene {
            position: relative;
            width: 300px;
            height: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            margin-top: 10px;
        }

        /* Star on top */
        .star {
            font-size: 40px;
            color: #ffd700;
            position: absolute;
            top: 10px;
            animation: glow 1.5s infinite alternate;
            z-index: 10;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .star:hover {
            transform: scale(1.2) rotate(15deg);
        }

        /* Tree Layers */
        .tree-layer {
            width: 0;
            height: 0;
            border-left-style: solid;
            border-right-style: solid;
            border-bottom-style: solid;
            position: relative;
        }

        .layer-1 {
            border-left: 50px solid transparent;
            border-right: 50px solid transparent;
            border-bottom: 90px solid #1e5631;
            z-index: 4;
        }

        .layer-2 {
            border-left: 90px solid transparent;
            border-right: 90px solid transparent;
            border-bottom: 110px solid #2b7a43;
            margin-top: -30px;
            z-index: 3;
        }

        .layer-3 {
            border-left: 130px solid transparent;
            border-right: 130px solid transparent;
            border-bottom: 130px solid #1e5631;
            margin-top: -40px;
            z-index: 2;
        }

        .layer-4 {
            border-left: 170px solid transparent;
            border-right: 170px solid transparent;
            border-bottom: 150px solid #2b7a43;
            margin-top: -50px;
            z-index: 1;
        }

        /* Tree Trunk */
        .trunk {
            width: 40px;
            height: 50px;
            background-color: #5c4033;
            margin-top: -5px;
            border-radius: 4px;
        }

        /* Ornaments / Lights */
        .bauble {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: twinkle 1s infinite alternate;
        }

        .b1 { top: 110px; left: -5px; background: #ff4757; animation-delay: 0.2s; }
        .b2 { top: 130px; left: 15px; background: #ffa502; animation-delay: 0.5s; }
        .b3 { top: 180px; left: -30px; background: #ff4757; animation-delay: 0.8s; }
        .b4 { top: 200px; left: 25px; background: #eccc68; animation-delay: 0.3s; }
        .b5 { top: 220px; left: -10px; background: #ff6b81; animation-delay: 0.9s; }
        .b6 { top: 270px; left: -50px; background: #ffa502; animation-delay: 0.4s; }
        .b7 { top: 290px; left: 10px; background: #ff4757; animation-delay: 0.7s; }
        .b8 { top: 310px; left: 50px; background: #eccc68; animation-delay: 0.1s; }

        /* Card Message Footer */
        .card-footer {
            margin-top: 15px;
            text-align: center;
        }

        .message-btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 71, 87, 0.4);
            transition: all 0.2s ease;
        }

        .message-btn:hover {
            background-color: #ff6b81;
            transform: translateY(-2px);
        }

        .hidden-message {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, margin-top 0.4s ease-out;
            color: #ffd700;
            font-size: 13px;
            font-style: italic;
        }

        .card.open .hidden-message {
            max-height: 50px;
            margin-top: 10px;
        }

        @keyframes twinkle {
            0% { opacity: 0.4; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        @keyframes glow {
            0% { text-shadow: 0 0 5px #ffd700; }
            100% { text-shadow: 0 0 20px #fffa65, 0 0 30px #ffd700; }
        }
    </style>
</head>
<body>

    <!-- Snow Generation Container -->
    <div id="snow-container"></div>

    <div class="card" id="holidayCard">
        <div class="greeting-header">
            <h1>Merry Christmas!</h1>
            <p>Wishing you joy, peace, and warmth.</p>
        </div>

        <div class="scene">
            <div class="star" title="Click me!">★</div>
            
            <div class="tree-layer layer-1"></div>
            <div class="tree-layer layer-2">
                <div class="bauble b1"></div>
                <div class="bauble b2"></div>
            </div>
            <div class="tree-layer layer-3">
                <div class="bauble b3"></div>
                <div class="bauble b4"></div>
                <div class="bauble b5"></div>
            </div>
            <div class="tree-layer layer-4">
                <div class="bauble b6"></div>
                <div class="bauble b7"></div>
                <div class="bauble b8"></div>
            </div>
            
            <div class="trunk"></div>
        </div>

        <div class="card-footer">
            <button class="message-btn" onclick="toggleMessage()">Open Message</button>
            <div class="hidden-message">"May your holidays sparkle with moments of love and laughter!"</div>
        </div>
    </div>

    <script>
        // Interactive Message Toggle
        function toggleMessage() {
            const card = document.getElementById('holidayCard');
            const btn = document.querySelector('.message-btn');
            card.classList.toggle('open');
            if (card.classList.contains('open')) {
                btn.textContent = "Close Message";
            } else {
                btn.textContent = "Open Message";
            }
        }

        // Dynamic Snowfall Generator
        const snowContainer = document.getElementById('snow-container');
        const numberOfSnowflakes = 40;

        for (let i = 0; i < numberOfSnowflakes; i++) {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            
            // Random properties for realistic snow effect
            const size = Math.random() * 4 + 2 + 'px';
            snowflake.style.width = size;
            snowflake.style.height = size;
            snowflake.style.left = Math.random() * 100 + 'vw';
            snowflake.style.animationDuration = Math.random() * 3 + 2 + 's';
            snowflake.style.animationDelay = Math.random() * 5 + 's';
            
            snowContainer.appendChild(snowflake);
        }
    </script>
</body>
</html>
